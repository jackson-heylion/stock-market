<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0a1120" />
  <meta name="description" content="A股模拟盘：历史快照、自选股、虚拟交易、资产盈亏与五套启动模型。" />
  <title>见微 · A股模拟交易台</title>
  <script>
    // Apply saved mode before styles load, avoiding a white/black flash on reload.
    try {
      if (localStorage.getItem('stock-market-theme-v1') === 'light')
        document.documentElement.dataset.theme = 'light';
    } catch {}
  </script>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./theme.css" />
  <link rel="stylesheet" href="./radar.css" />
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#overview" aria-label="返回总览"><span class="brand-mark">见</span><span><strong>见微</strong><small>MARKET LAB</small></span></a>
      <div class="side-label">WORKSPACE</div>
      <nav class="side-nav" aria-label="主导航">
        <button class="nav-link active" data-page="overview"><span>◫</span> 资产总览</button>
        <button class="nav-link" data-page="quotes"><span>↗</span> 行情中心</button>
        <button class="nav-link" data-page="radar"><span>◈</span> 市场雷达</button>
        <button class="nav-link" data-page="models"><span>◇</span> 策略中心</button>
        <button class="nav-link" data-page="trades"><span>≡</span> 成交流水</button>
        <button class="nav-link" data-page="settings"><span>⚙</span> 设置</button>
      </nav>
      <div class="sidebar-bottom"><div class="pulse-dot"></div><span>独立本地模拟账户</span><small>无券商连接 · 本地数据保存</small></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumbs"><span>交易工作台</span><b>/</b><span id="page-heading">资产总览</span></div>
        <div class="top-actions">
          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换到亮色主题" aria-pressed="false" title="切换到亮色主题">
            <span class="theme-icon" aria-hidden="true">☀</span>
            <span class="theme-label">亮色</span>
          </button>
          <span class="snapshot-pill"><span class="pulse-dot"></span><span id="market-status">行情连接中 · 初始快照 11.19</span></span>
          <button class="icon-btn" id="export-btn" title="导出账本">↧ <span>导出</span></button>
        </div>
      </header>
      <main class="main" id="main" tabindex="-1"></main>
      <footer class="footer">见微 Stock Market Lab <span>模拟研究工具 · 公开行情可能延迟 · 本地浏览器保存 <span id="release-info"></span></span></footer>
    </div>
  </div>
  <dialog id="trade-dialog" class="modal">
    <form id="trade-form" method="dialog" novalidate>
      <div class="modal-header">
        <div>
          <div class="eyebrow">PAPER ORDER</div>
          <h2 id="trade-title">模拟下单</h2>
        </div>
        <button class="close" type="button" data-close="trade-dialog" aria-label="关闭">×</button>
      </div>
      <label>股票<select id="trade-code" required></select></label>
      <div class="segmented">
        <label><input type="radio" name="side" value="BUY" checked><span>买入</span></label>
        <label><input type="radio" name="side" value="SELL"><span>卖出</span></label>
      </div>
      <div class="fields">
        <label>成交价（元）<input id="trade-price" type="number" step="0.01" min="0.01" required></label>
        <label>股数（100的整数倍）<input id="trade-qty" type="number" min="100" step="100" required></label>
      </div>
      <div id="order-preview" class="order-preview"></div>
      <p class="form-tip">遵循 100 股整手与 T+1 交易规则，买卖计收模拟规费</p>
      <div class="dialog-actions">
        <button type="button" class="btn subtle" data-close="trade-dialog">取消</button>
        <button type="submit" class="btn primary">确认模拟成交</button>
      </div>
    </form>
  </dialog>
  <dialog id="quote-dialog" class="modal">
    <form id="quote-form" method="dialog" novalidate>
      <div class="modal-header">
        <div>
          <div class="eyebrow">MANUAL MARK</div>
          <h2>手动更新参考价格</h2>
        </div>
        <button class="close" type="button" data-close="quote-dialog" aria-label="关闭">×</button>
      </div>
      <label>股票<select id="quote-code" required></select></label>
      <div class="fields">
        <label>价格（元）<input id="quote-price" type="number" min="0.01" step="0.01" required></label>
        <label>报价日期<input id="quote-date" type="date" required></label>
      </div>
      <p class="form-tip">用于持仓参考估值，不修改历史成交记录</p>
      <div class="dialog-actions">
        <button type="button" class="btn subtle" data-close="quote-dialog">取消</button>
        <button type="submit" class="btn primary">更新估值</button>
      </div>
    </form>
  </dialog>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
