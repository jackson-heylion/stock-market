<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0a1120" />
  <meta name="description" content="A股模拟盘：历史快照、自选股、虚拟交易、资产盈亏与五套启动模型。" />
  <title>见微 · A股模拟交易台</title>
  <link rel="stylesheet" href="./style.css" />
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#overview" aria-label="返回总览"><span class="brand-mark">见</span><span><strong>见微</strong><small>MARKET LAB</small></span></a>
      <div class="side-label">WORKSPACE</div>
      <nav class="side-nav" aria-label="主导航">
        <button class="nav-link active" data-page="overview"><span>◫</span> 资产总览</button>
        <button class="nav-link" data-page="watchlist"><span>◎</span> 观察列表</button>
        <button class="nav-link" data-page="models"><span>◇</span> 策略模型</button>
        <button class="nav-link" data-page="trades"><span>≡</span> 成交流水</button>
      </nav>
      <div class="sidebar-bottom"><div class="pulse-dot"></div><span>独立本地模拟账户</span><small>无券商连接 · 非实时行情</small></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumbs"><span>交易工作台</span><b>/</b><span id="page-heading">资产总览</span></div>
        <div class="top-actions"><span class="snapshot-pill"><span class="pulse-dot"></span> 2026.11.19 收盘快照</span><button class="icon-btn" id="export-btn" title="导出账本">↧ <span>导出</span></button></div>
      </header>
      <main class="main" id="main" tabindex="-1"></main>
      <footer class="footer">见微 Stock Market Lab <span>模拟交易仅用于研究 · 价格需要手动更新 · 本地浏览器保存</span></footer>
    </div>
  </div>
  <dialog id="trade-dialog" class="modal">
    <form id="trade-form" method="dialog" novalidate>
      <div class="modal-header"><div><div class="eyebrow">PAPER ORDER</div><h2 id="trade-title">模拟下单</h2></div><button class="close" type="button" data-close="trade-dialog" aria-label="关闭">×</button></div>
      <label>股票<select id="trade-code" required></select></label>
      <div class="segmented"><label><input type="radio" name="side" value="BUY" checked><span>买入</span></label><label><input type="radio" name="side" value="SELL"><span>卖出</span></label></div>
      <div class="fields"><label>成交价（元）<input id="trade-price" type="number" step="0.01" min="0.01" required></label><label>股数（100的整数倍）<input id="trade-qty" type="number" min="100" step="100" required></label></div>
      <div id="order-preview" class="order-preview"></div>
      <p class="form-tip">手动模拟按输入价立即成交，不提供撮合、盘口、真实订单。A股买入遵守整手和T+1限制；卖出收取模拟印花税。</p>
      <div class="dialog-actions"><button type="button" class="btn subtle" data-close="trade-dialog">取消</button><button type="submit" class="btn primary">确认模拟成交</button></div>
    </form>
  </dialog>
  <dialog id="quote-dialog" class="modal">
    <form id="quote-form" method="dialog" novalidate>
      <div class="modal-header"><div><div class="eyebrow">MANUAL MARK</div><h2>手动更新参考价格</h2></div><button class="close" type="button" data-close="quote-dialog" aria-label="关闭">×</button></div>
      <label>股票<select id="quote-code" required></select></label>
      <div class="fields"><label>价格（元）<input id="quote-price" type="number" min="0.01" step="0.01" required></label><label>报价日期<input id="quote-date" type="date" required></label></div>
      <p class="form-tip">这不是实时行情。更新只影响持仓估值和参考报价，不回写历史成交价；操作会标注为“用户手动维护”。</p>
      <div class="dialog-actions"><button type="button" class="btn subtle" data-close="quote-dialog">取消</button><button type="submit" class="btn primary">更新估值</button></div>
    </form>
  </dialog>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
