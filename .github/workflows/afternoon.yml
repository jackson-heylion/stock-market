name: 波段策略 · 核验与选择执行
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'review 刷新 / selected 选择执行 / cancel 取消待核验'
        type: choice
        options: [review, selected, cancel]
        default: review
      selection:
        description: '选择指令，例如 300502:OPEN,600519:REDUCE'
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - dual-strategy.js
      - scripts/run-wave.mjs
      - .github/workflows/afternoon.yml
      - data/wave-evidence.json
  schedule:
    - cron: '35 1 * * 1-5'
    - cron: '30 6 * * 1-5'
    - cron: '30 7 * * 1-5'
permissions:
  contents: write
  actions: write
concurrency:
  group: stock-market-robot-account
  cancel-in-progress: false
jobs:
  wave:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && npm run check
      - name: Revalidate selected or scheduled strategy
        env:
          WAVE_MODE: ${{ github.event_name == 'schedule' && (github.event.schedule == '30 7 * * 1-5' && 'review' || 'scheduled') || inputs.mode || 'review' }}
          WAVE_SELECTION: ${{ inputs.selection }}
        run: node scripts/run-wave.mjs
      - name: Commit and publish wave ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "stock-market-paper-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bot.json
          git diff --cached --quiet && exit 0
          git commit -m "data: wave strategy review and selected execution"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run pages.yml --ref main
