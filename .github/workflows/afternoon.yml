name: 14:30 daily conditional paper strategy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - afternoon.js
      - afternoon-rules.js
      - .github/workflows/afternoon.yml
  schedule:
    # Beijing 14:30, with one retry at 14:40 if quotes were unavailable.
    - cron: '30,40 6 * * 1-5'
permissions:
  contents: write
  actions: write
concurrency:
  group: stock-market-robot-account
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && npm run check
      - name: Wait for 14:30 on early same-day manual or initial push
        shell: bash
        run: |
          local_time=$(TZ=Asia/Shanghai date +%H%M)
          if [[ "$local_time" > "1414" && "$local_time" < "1430" ]]; then
            until [[ "$(TZ=Asia/Shanghai date +%H%M)" > "1429" ]]; do sleep 10; done
          fi
      - name: Execute fresh-quote conditional paper strategy
        run: node afternoon.js
      - name: Publish bot ledger without overwriting other decisions
        id: commit
        run: |
          if git diff --quiet -- data/bot.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "stock-market-paper-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bot.json
          git commit -m "data(bot): record 14:30 verified paper decisions"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 2
          done
          exit 1
      - name: Publish updated ledger to Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
