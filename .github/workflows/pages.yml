name: Deploy static paper trading to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Snapshot fallback for browsers that cannot access the cross-origin news host.
  # Scheduled Actions can run late or be skipped; the UI displays source timestamps.
  schedule:
    - cron: '*/10 1-9 * * 1-5'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && npm run check
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate community parser
        run: python3 scripts/test_community_snapshot.py
      - name: Write release metadata
        run: |
          mkdir -p data
          printf '{"sha":"%s"}\n' "$GITHUB_SHA" > data/version.json
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
