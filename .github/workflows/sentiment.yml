name: Collect public market sentiment snapshots
on:
  workflow_dispatch:
  schedule:
    - cron: '3,13,23,33,43,53 1-9 * * 1-5'
permissions:
  contents: write
concurrency:
  group: sentiment-snapshots
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: News snapshot
        run: python3 scripts/build_news_snapshot.py
      - name: Community snapshot
        run: python3 scripts/build_community_snapshot.py
      - name: Publish only data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fast-news.json data/community.json
          git diff --cached --quiet && exit 0
          git commit -m "data: update public sentiment snapshots"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
